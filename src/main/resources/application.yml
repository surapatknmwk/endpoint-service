# =====================================================================
# Consolidated Endpoint Services - default (local) profile
# Merges authen + core + master + search into a single Spring Boot app.
# Each module keeps its original API paths via a per-module path prefix
# (/endpoint-authen-service, /endpoint-core-service, ...), so the app runs
# at the root context path on a single port.
# =====================================================================

server:
  port: 8081

spring:
  application:
    name: endpoint-services
  # machine-only overrides (secrets, LAN IPs) — gitignored; absent on the server = ignored
  config:
    import: "optional:classpath:application-local.yml"

  # Threads shared by every @Scheduled task (default is 1, so one slow task would delay the others).
  task:
    scheduling:
      pool:
        size: 3
      thread-name-prefix: sched-

  # Shared PostgreSQL database (all modules used the same endpoint_db)
  datasource:
    url: jdbc:postgresql://localhost:5433/endpoint_db
    username: admin
    password: admin123
    driver-class-name: org.postgresql.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      pool-name: EndpointServicesHikariPool
      minimum-idle: 5
      maximum-pool-size: 30
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      auto-commit: true

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # Two read models (core + search) map onto the same physical tables,
      # so schema management is left to the database.
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 100
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

# ---- JWT (authentication module) ----
jwt:
  secret: YourSuperSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm
  expiration: 3600000
  # login again after this many days even if the webapp keeps refreshing (0 = no limit)
  session-max-age-days: 7

# ---- Password encryption (authentication module) ----
# AES-256 key, Base64 of 32 random bytes (openssl rand -base64 32). Local-only value;
# prod reads PASSWORD_ENCRYPTION_KEY. Changing it makes stored passwords undecryptable.
password:
  encryption:
    key: bG9jYWwtZGV2LW9ubHkta2V5LTMyLWJ5dGVzLWxvbmc=

# ---- Security filter (shared across core + master + search modules) ----
security:
  filter:
    enabled: false
    token:
      header: Authorization
      prefix: Bearer
  # Comma-separated origins allowed to call the API cross-origin (read by CorsAllowlistFilter).
  # Empty = none: the webapp reaches the API same-origin through the Vite proxy / Caddy.
  cors:
    allowed-origins:
  # Repeated-call protection (read by RequestThrottleFilter, answers 429). Not repeated in
  # application-prod.yml: prod inherits these values; override with SECURITY_THROTTLE_* env vars.
  throttle:
    enabled: true
    # Flood guard: max calls per client IP, all endpoints together, per window.
    window-seconds: 10
    max-requests: 200
    # Double-submit guard: the same write (same token + method + URL) is accepted once per window.
    duplicate-window-seconds: 3
    # POST endpoints that only read/calculate, so calling them again right away is normal.
    duplicate-exempt-posts: >-
      /endpoint-search-service/**,
      /endpoint-master-service/api/address/**,
      /endpoint-master-service/api/provinces/search,
      /endpoint-core-service/api/jobs/route-preview
  # Risky activity is aggregated in memory and written to table security_events this often
  # (SecurityEventRecorder): one row per distinct event per interval, never one per request.
  events:
    flush-seconds: 30

# ---- API filter token prefix ----
# Still consumed independently by com.core.service.security.SecurityService;
# token.prefix intentionally omitted so the default "Bearer " (with trailing
# space) is used, matching the original core SecurityService behaviour.

# ---- Google Maps Platform (Routes API) ----
# Requires a Google Cloud API key with the "Routes API" enabled.
# Never hardcode the key here -- export GOOGLE_MAPS_API_KEY in the
# environment before starting the app.
google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:}
    routes-base-url: https://routes.googleapis.com
    # Geocoding API (ที่อยู่ → พิกัดบ้านลูกค้า ตอนบันทึก order ที่ไม่มีหมุดในลิงก์) — key เดียวกัน ต้องเปิด Geocoding API
    # ใน Google Cloud project ด้วย · นับโควตารายวันร่วมกับ Routes (daily-request-limit ข้างล่าง)
    geocoding-base-url: https://maps.googleapis.com
    # ค่าเริ่มต้นของเพดานจำนวนครั้งที่ยิง Google Routes API จริงต่อวัน (วันตามเวลา Asia/Bangkok) — ใช้เมื่อตาราง
    # configuration ไม่มีแถว code 'GR_DAILY' (หรือไม่ active/ค่าไม่ถูกต้อง) ค่าจริงแก้ได้ตลอดที่ configuration.value_1
    # ผลที่ cache ไว้ใน subdistrict_distances ไม่นับ; เกินแล้วตอบ 429 (ดูสถิติที่ GET .../google-distance/usage)
    daily-request-limit: 100

# ---- Self-registration + LINE Login (docs/user-stories/register.md, RegistrationProperties) ----
# Not repeated in application-prod.yml: prod reads the same keys, override with the env vars.
registration:
  enabled: ${REGISTRATION_ENABLED:true}
  default-role: NORMAL          # role of an "เจ้าของร้าน" sign-up (DRIVER for "คนส่ง")
  terms-version: "1"
  max-per-ip-per-hour: 5
# Real local values (secret, token, LAN IP) live in application-local.yml (gitignored, see spring.config.import).
line:
  login:
    enabled: ${LINE_LOGIN_ENABLED:false}
    channel-id: ${LINE_CHANNEL_ID:}
    channel-secret: ${LINE_CHANNEL_SECRET:}       # env only — never commit
    redirect-uri: ${LINE_REDIRECT_URI:}           # must equal the Callback URL on the LINE channel
    attempt-ttl-seconds: 600
    ticket-ttl-seconds: 900
  # Copy some bell notifications to the recipient's LINE chat (docs/task/enhanment/lineNotify/design.md).
  # Needs a Messaging API channel under the SAME provider as the login channel above.
  messaging:
    enabled: ${LINE_MESSAGING_ENABLED:false}
    channel-access-token: ${LINE_MESSAGING_TOKEN:}   # long-lived token — env only, never commit
    add-friend-url: ${LINE_ADD_FRIEND_URL:}          # https://line.me/R/ti/p/@xxxx
    webapp-base-url: ${WEBAPP_BASE_URL:}             # link on the card's "เปิดดู" button
    types: JOB_REQUESTED,JOB_REQUEST_ACCEPTED,JOB_REQUEST_DECLINED,TEAM_INVITED,JOB_DUE_TOMORROW,ORDER_DUE_SOON,STOP_CANCEL_REQUESTED,JOB_REQUEST_EXPIRED,JOB_RELEASED,JOB_NOT_STARTED
    quiet-from: "21:00"                              # created during quiet hours = sent at quiet-to
    quiet-to: "07:00"
    max-attempts: 3
    max-age-hours: 24

# ---- Scheduled tasks (com.core.service.scheduler) ----
# Every task lives under scheduler.<name>. Cron fields: second minute hour day month weekday,
# Asia/Bangkok time. "-" turns a task off. Not repeated in application-prod.yml.
scheduler:
  # "พรุ่งนี้มีนัดส่งงาน" for jobs scheduled tomorrow that have not started. Safe to run often:
  # one notification per job + date; hourly so jobs created later in the day are reminded too.
  job-due-reminder:
    cron: "0 5 * * * *"
  # "ออเดอร์ใกล้ถึงวันนัดส่ง": order ที่ยังไม่ได้จัดเข้างาน นัดภายใน 7 วัน — 1 แจ้งเตือนต่อเจ้าของต่อวัน
  # แต่ละ order เตือนครั้งเดียวต่อวันนัด · 07:00 = พ้นช่วงเงียบของ LINE พอดี
  order-due-reminder:
    cron: "0 0 7 * * *"
  notification-cleanup:
    cron: "0 5 3 * * *"
    retention-days: 90
  # ลบแถว user_sessions ที่หมดอายุแล้ว (ปกติจะถูกลบเฉพาะตอนมีคนเอา token เก่ามายิง)
  session-cleanup:
    cron: "0 10 3 * * *"
  # ประกาศระบบ (system_announcements): ส่งประกาศที่ถึง publish_at + ถอนที่ยกเลิก / หมดอายุ
  announcement:
    cron: "0 */5 * * * *"
  # คำขอรับงานที่คนส่งไม่ตอบ → EXPIRED + แจ้งเจ้าของ (กฎเวลาอยู่ที่ job-request ด้านล่าง)
  job-request-expiry:
    cron: "0 */10 * * * *"
  # งานที่นัดวันนี้ มีคนส่งแล้ว แต่เลย job-request.late-start-hour ยังไม่เริ่ม → แจ้งเจ้าของ + คนส่ง (ครั้งเดียวต่องานต่อวัน)
  job-late-start:
    cron: "0 15 * * * *"
  # ส่งแจ้งเตือนที่รอส่ง LINE (notifications.line_status = PENDING) — ไม่ทำอะไรเมื่อ line.messaging.enabled=false
  line-delivery:
    cron: "0 * * * * *"

# ---- คำขอรับงาน / งานไม่เริ่ม (driver-risk รอบ 3 · com.core.service.team.JobRequestPolicy) ----
# คำขอหมดอายุที่ requested_at + ttl-hours หรือ cutoff-hour:00 ของวันนัด แล้วแต่อย่างไหนถึงก่อน
# แต่ให้เวลาตอบอย่างน้อย min-hours เสมอ (วันนัดเก็บแค่วันที่ — ขอวันเดียวกับวันนัดจะได้ไม่หมดอายุทันที)
job-request:
  ttl-hours: 24
  cutoff-hour: 8
  min-hours: 2
  # ถึงวันนัดแล้ว เลยเวลานี้งานยังไม่เริ่ม = เตือน
  late-start-hour: 10

# ---- Search module tuning ----
search:
  default-page-size: 20
  max-page-size: 100
  enable-fuzzy-search: true
  min-search-length: 2

# ---- Actuator ----
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# ---- OpenAPI / Swagger ----
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    disable-swagger-default-url: true

# ---- Logging ----
logging:
  level:
    root: INFO
    com.search: DEBUG
    org.springframework.data: INFO
    org.hibernate.SQL: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
