# =====================================================================
# Consolidated Endpoint Services - production profile
# Sensitive values are injected via environment variables.
# =====================================================================

server:
  port: ${SERVER_PORT:8080}
  # Bind to loopback only -- the reverse proxy (Caddy) is the only public entry point.
  address: ${SERVER_ADDRESS:127.0.0.1}
  # Sized for a small single-VPS deployment (default is 200 threads).
  tomcat:
    threads:
      max: 50
      min-spare: 5

spring:
  application:
    name: endpoint-services

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      pool-name: EndpointServicesHikariPool
      minimum-idle: 2
      maximum-pool-size: 10
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      auto-commit: true

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 100
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

password:
  encryption:
    key: ${PASSWORD_ENCRYPTION_KEY}

security:
  filter:
    enabled: true
    token:
      header: Authorization
      prefix: Bearer
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

# Still consumed independently by com.core.service.security.SecurityService;
# token.prefix intentionally omitted so the default "Bearer " (with trailing
# space) is used, matching the original core SecurityService behaviour.

search:
  default-page-size: 20
  max-page-size: 100
  enable-fuzzy-search: true
  min-search-length: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: false
    operations-sorter: method
    tags-sorter: alpha
    disable-swagger-default-url: true

logging:
  level:
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
